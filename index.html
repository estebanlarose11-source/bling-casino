function renderRefill(root) {
  const ok = wallet.canRefill(), ad = ads.status('credits'), daily = dailyStatus();
  root.innerHTML = `
    <section class="panel daily">
      <div class="daily-gift${ok ? ' ready' : ''}">💰</div>
      <h1>Recharger mon solde</h1>
      <p class="muted">Tu démarres avec ${fmt(START / 100)} d’argent fictif. Tu peux recharger à ${fmt(START / 100)} uniquement quand ton solde passe <b>sous ${fmt(REFILL_BELOW / 100)}</b>.</p>
      <div class="refill-bal"><small>Solde actuel</small><b>${fmt(wallet.balance)}</b></div>
      <button class="btn primary lg" data-refill ${ok ? '' : 'disabled'}>${ok ? `Recharger à ${fmt(START / 100)}` : `Disponible sous ${fmt(REFILL_BELOW / 100)}`}</button>
      ${ok ? '' : `<p class="muted small">Encore ${fmt(wallet.balance - REFILL_BELOW / 100)} à jouer avant de pouvoir recharger.</p>`}
      <div class="sep"></div>
      <button class="btn lg ad-btn" data-ad ${ad.ok ? '' : 'disabled'}>▶ Regarder une pub <span>${PLACEMENTS.credits.label}</span></button>
      <p class="muted small">${ad.ok ? `Encore ${ad.left} pub${ad.left > 1 ? 's' : ''} récompensée${ad.left > 1 ? 's' : ''} aujourd’hui, même au-dessus de ${fmt(REFILL_BELOW / 100)}.` : ad.reason}</p>
      <a class="btn ghost" href="#profil">${daily.ready ? '🎁 Ton bonus du jour est disponible' : '🎁 Bonus du jour et niveaux'}</a>
    </section>`;
  root.querySelector('[data-refill]').onclick = (e) => {
    if (!wallet.refill()) return toast(`Recharge possible seulement sous ${fmt(REFILL_BELOW / 100)}`, 'warn');
    sfx.unlock(); sfx.bigWin(); fx.coins(80, e.currentTarget);
    toast(`Solde rechargé à ${fmt(START / 100)}`, 'ok');
    renderRefill(root);
  };
  root.querySelector('[data-ad]').onclick = async (e) => {
    const btn = e.currentTarget;
    btn.disabled = true;
    const r = await ads.watch('credits');
    if (r.ok) { sfx.unlock(); sfx.win(); fx.coins(40, btn); }
    toast(r.message, r.ok ? 'ok' : 'warn');
    renderRefill(root);
  };
}

__mods['main.js'] = (() => {
const { wallet, fmt } = __mods['wallet.js'];
const { profiles } = __mods['profile.js'];
const { mountHud } = __mods['hud.js'];
const { mountLikes } = __mods['likes.js'];
const { renderProfile } = __mods['pages/profile.js'];
const { mountFx } = __mods['fx.js'];
const { mountAllArt } = __mods['art/index.js'];
const { renderLobby } = __mods['pages/lobby.js'];
const { renderGame, leaveGame } = __mods['pages/game.js'];
const { renderRefill, renderResponsible } = __mods['pages/account.js'];
const { ALL_GAMES } = __mods['games/index.js'];

const view = document.getElementById('view');

const routes = [
  { re: /^(accueil)?$/, page: (r) => renderLobby(r), nav: 'home' },
  { re: /^lobby-(\w+)$/, page: (r, m) => renderLobby(r, { filter: m[1] }), nav: 'slots' },
  { re: /^game-([\w-]+)$/, page: (r, m) => renderGame(r, { id: m[1] }), nav: 'slots' },
  { re: /^(profil|vip)$/, page: (r) => renderProfile(r), nav: 'vip' },
  { re: /^(recharger|daily)$/, page: (r) => renderRefill(r), nav: 'refill' },
  { re: /^responsable$/, page: (r) => renderResponsible(r), nav: 'resp' },
];

function route() {
  const path = location.hash.replace(/^#\/?/, '');
  leaveGame();
  const hit = routes.find((r) => r.re.test(path)) || routes[0];
  view.classList.remove('enter');
  hit.page(view, path.match(hit.re) || []);
  void view.offsetWidth;
  view.classList.add('enter');
  document.querySelectorAll('[data-nav]').forEach((a) => a.classList.toggle('on', a.dataset.nav === hit.nav));
  document.body.classList.remove('side-open');
  scrollTo({ top: 0, behavior: 'instant' });
}

function updateWallet() {
  document.querySelectorAll('[data-balance]').forEach((n) => { n.textContent = fmt(wallet.balance); });
}

document.querySelector('.side-games').innerHTML = ALL_GAMES.map((g) => `<a href="#game-${g.id}" data-nav="g-${g.id}"><span class="gdot" style="background:${g.original ? `linear-gradient(135deg,${g.colors[0]},${g.colors[1]})` : 'linear-gradient(135deg,#f59e0b,#ef4444)'}"></span>${g.name}</a>`).join('');
document.querySelector('[data-toggle-side]').onclick = () => document.body.classList.toggle('side-open');
document.querySelector('.side-scrim').onclick = () => document.body.classList.remove('side-open');

wallet.addEventListener('change', updateWallet);
addEventListener('hashchange', route);
mountAllArt();
mountFx();
updateWallet();
route();
mountHud();
mountLikes();
profiles.addEventListener('change', route); // login, logout or switch: reload the page for the new player

return {  };
})();

</script>
