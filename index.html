<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SpinBet Casino</title>
  <meta name="description" content="SpinBet Casino : machines à sous, roulettes, roue, blackjack, mines et crash en argent fictif.">
  <meta name="theme-color" content="#0b0f17">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎰</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@700;900&family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
/* ============ Tokens ============ */
:root {
  --bg: #09090a;
  --bg-2: #111012;
  --panel: #161214;
  --panel-2: #1f191b;
  --panel-3: #2b2225;
  --line: #34282b;
  --text: #f3eeef;
  --muted: #a8999c;
  --green: #ff2340;
  --green-d: #b3001b;
  --cyan: #ff7a45;
  --purple: #e11d48;
  --pink: #ff2d55;
  --gold: #fbbf24;
  --red: #f43f5e;
  --radius: 14px;
  --side: 248px;
  --top: 64px;
  --shadow: 0 10px 40px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  background-image: radial-gradient(1200px 600px at 80% -10%, rgba(255, 35, 64, .10), transparent 60%),
    radial-gradient(900px 500px at -10% 20%, rgba(179, 0, 27, .08), transparent 60%);
  background-attachment: fixed;
  color: var(--text);
  font: 15px/1.5 Inter, system-ui, -apple-system, Segoe UI, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
h1, h2, h3, h4 { margin: 0; line-height: 1.15; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--panel-3); border-radius: 10px; }

/* ============ Buttons ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 18px; border-radius: 10px; font-weight: 700;
  background: var(--panel-3); transition: transform .15s, filter .15s, background .15s, box-shadow .2s;
}
.btn:hover { filter: brightness(1.15); }
.btn:active { transform: scale(.96); }
.btn.primary { background: linear-gradient(180deg, #ff5468, var(--green-d)); color: #fff; box-shadow: 0 0 0 1px rgba(255, 35, 64, .4), 0 6px 24px rgba(255, 35, 64, .25); }
.btn.ghost { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.btn.lg { height: 50px; padding: 0 26px; font-size: 16px; border-radius: 12px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.icon-btn { width: 40px; height: 40px; border-radius: 10px; background: var(--panel-2); font-size: 18px; }

/* ============ Layout ============ */
.side {
  position: fixed; inset: 0 auto 0 0; width: var(--side); z-index: 40;
  background: rgba(17, 14, 16, .96); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 16px 12px; gap: 6px; overflow-y: auto;
  transition: transform .3s cubic-bezier(.2, .8, .2, 1);
}
.logo { display: flex; align-items: center; gap: 10px; font: 900 18px Orbitron, sans-serif; letter-spacing: 1px; padding: 6px 8px 18px; }
.logo em { font-style: normal; color: var(--green); text-shadow: 0 0 12px rgba(255, 35, 64, .7); }
.logo-mark {
  width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px;
  background: linear-gradient(135deg, #ff4d5e, #8f0014); color: #fff; font-size: 18px;
  box-shadow: 0 0 20px rgba(255, 35, 64, .6);
}
.side-nav { display: flex; flex-direction: column; gap: 2px; }
.side-nav a {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px;
  color: #c3cbd9; font-weight: 600; transition: background .15s, color .15s;
}
.side-nav a span { width: 22px; text-align: center; }
.side-nav a:hover { background: var(--panel-2); color: #fff; }
.side-nav a.on { background: var(--panel-3); color: #fff; box-shadow: inset 3px 0 0 var(--green); }
.side-label { margin: 16px 12px 4px; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.side-vip { margin-top: auto; padding: 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.side-vip small { color: var(--muted); display: block; font-size: 11px; }
.side-foot { padding: 12px; color: var(--muted); font-size: 13px; }
.side-scrim { display: none; }

.top {
  position: sticky; top: 0; z-index: 30; height: var(--top); margin-left: var(--side);
  display: flex; align-items: center; gap: 12px; padding: 0 24px;
  background: rgba(10, 9, 10, .82); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line);
}
.burger, .logo.mobile { display: none; }
.top-wallet { margin: 0 auto; display: flex; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.balance { display: flex; align-items: center; gap: 8px; padding: 0 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
.balance .cur { color: var(--green); }
.top-right { position: absolute; right: 24px; display: flex; align-items: center; gap: 12px; }
.demo-tag { font-size: 11px; font-weight: 800; letter-spacing: 1px; padding: 6px 10px; border-radius: 8px; color: var(--gold); background: rgba(251, 191, 36, .1); border: 1px solid rgba(251, 191, 36, .3); }

.view { margin-left: var(--side); padding: 24px; max-width: calc(1240px + var(--side)); min-height: calc(100vh - var(--top) - 60px); }
.view.enter { animation: viewIn .35s ease both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } }
.foot { margin-left: var(--side); padding: 20px 24px 28px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); }
.foot a { color: var(--text); text-decoration: underline; }
.bottom-nav { display: none; }
section { margin-bottom: 28px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
.sec-head h2 { font-size: 18px; }
.sec-head small { color: var(--muted); }

/* ============ Lobby ============ */
.hero { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
.hero-main {
  position: relative; overflow: hidden; border-radius: 18px; min-height: 320px; padding: 36px;
  display: flex; align-items: center;
  background: radial-gradient(500px 300px at 80% 30%, rgba(250, 204, 21, .18), transparent 70%),
    linear-gradient(135deg, #2c0a10 0%, #150809 60%, #0b0a0b 100%);
  border: 1px solid rgba(255, 35, 64, .3); box-shadow: var(--shadow), inset 0 0 80px rgba(255, 35, 64, .12);
}
.hero-copy { position: relative; z-index: 2; max-width: 440px; }
.eyebrow { display: inline-block; font-size: 12px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: var(--green); margin-bottom: 12px; }
.hero h1 { font: 900 clamp(30px, 4vw, 46px)/1.05 Orbitron, sans-serif; }
.hero h1 em { font-style: normal; background: linear-gradient(90deg, var(--gold), #f97316); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { color: #b8c2d4; margin: 14px 0 22px; }
.hero-cta { display: flex; gap: 10px; flex-wrap: wrap; }
.hero-art { position: absolute; right: 0; top: 0; bottom: 0; width: 50%; }
.hero-art span { position: absolute; filter: drop-shadow(0 10px 30px rgba(0, 0, 0, .6)); }
.h-moon { font-size: 90px; right: 8%; top: 6%; filter: drop-shadow(0 0 40px rgba(253, 224, 71, .8)) !important; animation: float 6s ease-in-out infinite; }
.h-house { font-size: 110px; right: 34%; bottom: 10%; animation: float 5s ease-in-out infinite .5s; }
.h-wolf { font-size: 150px; right: 6%; bottom: 4%; animation: wolfLean 3.5s ease-in-out infinite; }
.h-pig { font-size: 70px; right: 58%; bottom: 8%; animation: float 4s ease-in-out infinite 1s; }
@keyframes float { 50% { transform: translateY(-12px); } }
@keyframes wolfLean { 50% { transform: rotate(-6deg) translateX(-8px) scale(1.04); } }

.hero-side { display: grid; gap: 12px; }
.promo-tile {
  display: flex; align-items: center; gap: 14px; padding: 18px; border-radius: 16px;
  border: 1px solid var(--line); background: var(--panel); transition: transform .2s, border-color .2s, box-shadow .2s;
}
.promo-tile:hover { transform: translateY(-3px); }
.promo-tile span { font-size: 40px; }
.promo-tile small { display: block; color: var(--muted); }
.promo-tile.p1:hover { border-color: var(--green); box-shadow: 0 0 24px rgba(255, 35, 64, .2); }
.promo-tile.p2:hover { border-color: var(--pink); box-shadow: 0 0 24px rgba(244, 63, 158, .25); }
.promo-tile.p3:hover { border-color: var(--gold); box-shadow: 0 0 24px rgba(251, 191, 36, .25); }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 18px; scrollbar-width: none; }
.chip { flex: none; padding: 9px 16px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-weight: 600; font-size: 14px; color: #c3cbd9; transition: .15s; }
.chip:hover { color: #fff; border-color: #3a4864; }
.chip.on { background: var(--panel-3); color: #fff; border-color: var(--green); box-shadow: 0 0 16px rgba(255, 35, 64, .18); }

.game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
.game-card { display: block; transition: transform .25s cubic-bezier(.2, .8, .2, 1); }
.game-card:hover { transform: translateY(-6px); }
.thumb {
  position: relative; aspect-ratio: 3 / 4; border-radius: 16px; overflow: hidden;
  background: var(--card-bg); border: 1px solid rgba(255, 255, 255, .08);
  box-shadow: 0 8px 30px rgba(0, 0, 0, .4); transition: box-shadow .25s, border-color .25s;
}
.game-card:hover .thumb { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 34px var(--accent-glow); }
.thumb span { position: absolute; filter: drop-shadow(0 8px 16px rgba(0, 0, 0, .5)); transition: transform .4s; }
.thumb .a0 { font-size: 84px; left: 50%; top: 30%; transform: translate(-50%, -50%); }
.thumb .a1 { font-size: 46px; left: 10%; top: 50%; opacity: .9; transform: rotate(-12deg); }
.thumb .a2 { font-size: 46px; right: 10%; top: 52%; opacity: .9; transform: rotate(12deg); }
.game-card:hover .a0 { transform: translate(-50%, -56%) scale(1.08); }
.thumb-title { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 12px 14px; text-align: center; font: 900 17px/1.1 Orbitron, sans-serif; background: linear-gradient(transparent, rgba(0, 0, 0, .75)); text-shadow: 0 0 14px var(--accent); }
.play { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(5, 8, 14, .55); opacity: 0; transition: opacity .2s; }
.play svg { width: 60px; height: 60px; padding: 14px; border-radius: 50%; background: var(--green); color: #fff; box-shadow: 0 0 30px rgba(255, 35, 64, .6); transform: scale(.7); transition: transform .25s; }
.game-card:hover .play { opacity: 1; }
.game-card:hover .play svg { transform: scale(1); }
.badge { position: absolute; top: 10px; left: 10px; font-size: 10px; font-weight: 900; letter-spacing: 1px; padding: 4px 8px; border-radius: 6px; background: var(--gold); color: #1a1200; }
.badge.hot { background: var(--pink); color: #fff; }
.meta { padding: 10px 4px; }
.meta b { display: block; }
.meta small { color: var(--muted); }

.two-col { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
.feed { width: 100%; border-collapse: collapse; font-size: 14px; }
.feed th { text-align: left; color: var(--muted); font-weight: 600; padding: 8px 6px; border-bottom: 1px solid var(--line); }
.feed td { padding: 10px 6px; border-bottom: 1px solid rgba(38, 49, 71, .5); }
.feed .pos { color: var(--green); font-weight: 700; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat-grid div { background: var(--panel-2); border-radius: 12px; padding: 14px; }
.stat-grid small { display: block; color: var(--muted); font-size: 12px; }
.stat-grid b { font-size: 18px; font-variant-numeric: tabular-nums; }
.progress { height: 8px; border-radius: 8px; background: var(--panel-3); overflow: hidden; margin-top: 8px; }
.progress div { height: 100%; background: linear-gradient(90deg, var(--green), var(--cyan)); border-radius: 8px; box-shadow: 0 0 10px var(--green); transition: width .6s; }

/* ============ Game themes ============ */
.theme-wolf { --accent: #f59e0b; --accent2: #ef4444; --accent-glow: rgba(245, 158, 11, .45);
  --card-bg: radial-gradient(circle at 50% 25%, rgba(253, 224, 71, .35), transparent 45%), linear-gradient(160deg, #2a1640, #0e1f2e 60%, #10261b); }
.theme-fruits { --accent: #f43f9e; --accent2: #22d3ee; --accent-glow: rgba(244, 63, 158, .45);
  --card-bg: radial-gradient(circle at 50% 30%, rgba(244, 63, 158, .4), transparent 50%), linear-gradient(160deg, #2b0b3a, #0b1030 70%); }
.theme-pharaoh { --accent: #fbbf24; --accent2: #22d3ee; --accent-glow: rgba(251, 191, 36, .45);
  --card-bg: radial-gradient(circle at 50% 30%, rgba(251, 191, 36, .4), transparent 50%), linear-gradient(160deg, #3a2405, #10172a 70%); }

/* ============ Game page ============ */
.crumbs { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; margin-bottom: 14px; }
.crumbs a:hover { color: #fff; }
.crumbs b { color: var(--text); }
.game-host { margin: 0 auto 20px; max-width: max(420px, calc((100vh - var(--chrome)) * 5 / 3 + 76px)); }
.game-about { display: flex; gap: 20px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.game-about h2 small { font-size: 14px; color: var(--accent, var(--muted)); font-weight: 600; margin-left: 6px; }
.game-about p { margin: 6px 0 0; max-width: 700px; }
.about-tags { display: flex; gap: 8px; flex-wrap: wrap; }
.about-tags span { padding: 6px 12px; border-radius: 999px; background: var(--panel-2); font-size: 13px; font-weight: 600; }

/* ============ Slot machine ============ */
.slot {
  position: relative; overflow: hidden; border-radius: 22px; padding: 18px 18px 14px;
  border: 1px solid rgba(255, 255, 255, .08);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .5), 0 30px 80px rgba(0, 0, 0, .55), 0 0 60px var(--accent-glow);
  isolation: isolate; user-select: none; -webkit-user-select: none;
}
.slot-bg { position: absolute; inset: 0; z-index: -1; background: var(--slot-bg); transition: filter .6s; }
.slot-bg::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 120%, var(--accent-glow), transparent 60%); opacity: .5; }
.theme-wolf .slot-bg, .slot.theme-wolf { --slot-bg: radial-gradient(400px 220px at 85% 0%, rgba(253, 224, 71, .25), transparent 70%), linear-gradient(180deg, #1b1030 0%, #0d1726 55%, #0c1e14 100%); }
.slot.theme-fruits { --slot-bg: radial-gradient(500px 260px at 50% 0%, rgba(244, 63, 158, .25), transparent 70%), linear-gradient(180deg, #1d0930 0%, #0a0f28 100%); }
.slot.theme-pharaoh { --slot-bg: radial-gradient(500px 260px at 50% 0%, rgba(251, 191, 36, .22), transparent 70%), linear-gradient(180deg, #2a1a05 0%, #0f1424 100%); }
.slot.in-free .slot-bg { filter: hue-rotate(-25deg) saturate(1.4) brightness(1.1); }
.slot.in-hold .reels, .slot.in-hold .paylines { visibility: hidden; }
.slot.in-hold .slot-bg { filter: brightness(.7) saturate(1.3); }
.slot.wolf-night .slot-bg { filter: brightness(.45) saturate(1.5) hue-rotate(200deg); }

.slot-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 12px; flex-wrap: wrap; }
.slot-title { display: flex; align-items: center; gap: 12px; }
.slot-title .art { font-size: 36px; filter: drop-shadow(0 0 12px var(--accent)); }
.slot-title h2 { font: 900 20px Orbitron, sans-serif; text-shadow: 0 0 18px var(--accent); }
.slot-title small { color: var(--accent); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; font-size: 11px; }
.jackpots { display: flex; gap: 6px; }
.jp { min-width: 74px; text-align: center; padding: 5px 10px; border-radius: 10px; background: rgba(0, 0, 0, .35); border: 1px solid var(--jc); box-shadow: inset 0 0 14px color-mix(in srgb, var(--jc) 35%, transparent); }
.jp small { display: block; font-size: 9px; font-weight: 900; letter-spacing: 1.5px; color: var(--jc); }
.jp b { font: 800 13px Orbitron, sans-serif; }
.jp-mini { --jc: #22d3ee; } .jp-minor { --jc: #a855f7; } .jp-major { --jc: #f43f5e; } .jp-grand { --jc: #fbbf24; }

.feature-banner {
  display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap;
  max-height: 0; opacity: 0; overflow: hidden; transition: max-height .35s, opacity .35s, margin .35s;
}
.feature-banner.show { max-height: 80px; opacity: 1; margin-bottom: 10px; }
.feature-banner b { font: 900 14px Orbitron, sans-serif; color: var(--accent); text-shadow: 0 0 12px var(--accent); letter-spacing: 1px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: rgba(0, 0, 0, .4); border: 1px solid rgba(255, 255, 255, .12); font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
.pill.gold { color: var(--gold); border-color: rgba(251, 191, 36, .4); }
.pill.mult { color: var(--pink); border-color: var(--pink); box-shadow: 0 0 12px rgba(244, 63, 158, .5); }
.pill em { font-style: normal; }
.respins .dot { width: 10px; height: 10px; border-radius: 50%; background: #334155; }
.respins .dot.on { background: var(--green); box-shadow: 0 0 10px var(--green); }
.respins.reset { animation: pulseGlow .6s; }
@keyframes pulseGlow { 50% { box-shadow: 0 0 24px var(--green); transform: scale(1.08); } }

.slot-frame {
  padding: 10px; border-radius: 18px;
  background: linear-gradient(180deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .02));
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08), 0 0 0 2px rgba(0, 0, 0, .4), 0 0 30px var(--accent-glow);
}
.slot-stage { position: relative; border-radius: 12px; overflow: hidden; background: rgba(3, 6, 12, .65); }
.slot-stage.quake { animation: quake .45s linear infinite; }
@keyframes quake { 0%, 100% { transform: translate(0); } 25% { transform: translate(-4px, 2px) rotate(-.3deg); } 50% { transform: translate(3px, -2px); } 75% { transform: translate(-2px, -3px) rotate(.3deg); } }

.reels { display: grid; grid-template-columns: repeat(5, 1fr); aspect-ratio: 5 / 3; gap: 4px; padding: 0; }
.reel { position: relative; overflow: hidden; container-type: size; background: linear-gradient(180deg, rgba(255, 255, 255, .03), rgba(255, 255, 255, .06) 50%, rgba(255, 255, 255, .03)); }
.reel::before, .reel::after { content: ''; position: absolute; left: 0; right: 0; height: 14%; z-index: 2; pointer-events: none; }
.reel::before { top: 0; background: linear-gradient(rgba(3, 6, 12, .85), transparent); }
.reel::after { bottom: 0; background: linear-gradient(transparent, rgba(3, 6, 12, .85)); }
.strip { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
.reel.spinning .strip { filter: blur(2.5px) brightness(1.1); }
.reel.tease { box-shadow: inset 0 0 0 2px var(--gold), inset 0 0 40px rgba(251, 191, 36, .55); }
.reel.tease::before { background: linear-gradient(rgba(251, 191, 36, .3), transparent); }
.reel.landed .strip { animation: land .25s ease-out; }
@keyframes land { 40% { transform: translateY(2.5cqh); } }

.cell {
  position: relative; height: 33.3333cqh; display: grid; place-items: center;
  transition: opacity .25s, filter .25s;
}
.cell .g { font-size: 19cqh; line-height: 1; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .6)); transition: transform .3s; }
.cell .lbl { position: absolute; bottom: 7%; font: 900 4.2cqh Orbitron, sans-serif; letter-spacing: .1em; font-style: normal; padding: .4cqh 1.8cqh; border-radius: 4px; }
.cell.wild .lbl { background: linear-gradient(90deg, #f97316, #facc15); color: #1a0d00; box-shadow: 0 0 10px #f97316; }
.cell.scatter .lbl { background: linear-gradient(90deg, #7c3aed, #22d3ee); color: #fff; box-shadow: 0 0 10px #7c3aed; }
.cell.wild .g { filter: drop-shadow(0 0 10px rgba(249, 115, 22, .9)); }
.cell.scatter .g { filter: drop-shadow(0 0 14px rgba(253, 224, 71, .9)); }
.cell.coin .g { font-size: 15cqh; filter: drop-shadow(0 0 12px rgba(251, 191, 36, .9)); }
.cell .cv { position: absolute; bottom: 6%; font: 900 4.8cqh Orbitron, sans-serif; color: #fff7d6; text-shadow: 0 0 6px #f59e0b, 0 2px 0 #92400e; }
.cell.card .g { font: 900 15cqh Orbitron, sans-serif; color: var(--cc); text-shadow: 0 0 8px var(--cc), 0 0 22px var(--cc); -webkit-text-stroke: 1px rgba(255, 255, 255, .5); }
.c-seven { --cc: #ff2d55; }
.cell.s-seven .g { font-size: 24cqh; font-style: italic; }
.c-a { --cc: #f43f5e; } .c-k { --cc: #a855f7; } .c-q { --cc: #22d3ee; } .c-j { --cc: #00e701; } .c-t { --cc: #fbbf24; }
.cell.s-T .g { font-size: 12cqh; }
.cell.s-ankh .g { font: 900 20cqh serif; color: #fde047; text-shadow: 0 0 14px #f59e0b, 0 0 30px #f59e0b; }
.cell.pop .g { animation: symPop .5s cubic-bezier(.3, 1.8, .5, 1); }
@keyframes symPop { 0% { transform: scale(.6); } 60% { transform: scale(1.25); } }

.reels.has-win .cell:not(.win) { opacity: .35; filter: saturate(.4); }
.cell.win { z-index: 1; }
.cell.win::before { content: ''; position: absolute; inset: 6%; border-radius: 12px; border: 2px solid var(--accent); box-shadow: 0 0 16px var(--accent), inset 0 0 16px var(--accent-glow); animation: winBox 1s ease-in-out infinite; }
.cell.win .g { animation: winBounce 1s ease-in-out infinite; }
@keyframes winBox { 50% { opacity: .5; } }
@keyframes winBounce { 50% { transform: scale(1.14) rotate(-3deg); } }

.paylines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
.paylines polyline { fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; stroke-dasharray: 2000; animation: drawLine .6s ease-out both; opacity: .9; }
@keyframes drawLine { from { stroke-dashoffset: 2000; } to { stroke-dashoffset: 0; } }

.stage-layer { position: absolute; inset: 0; z-index: 4; pointer-events: none; container-type: size; }
.sticky-wild { position: absolute; display: grid; place-items: center; animation: stickIn .45s cubic-bezier(.3, 1.6, .5, 1) both; }
.sticky-wild::before { content: ''; position: absolute; inset: 5%; border-radius: 12px; background: radial-gradient(circle, rgba(249, 115, 22, .45), rgba(124, 45, 18, .7)); border: 2px solid #f97316; box-shadow: 0 0 20px #f97316, inset 0 0 20px rgba(250, 204, 21, .5); }
.sticky-wild .g { position: relative; font-size: 19cqh; filter: drop-shadow(0 0 10px #f97316); }
.sticky-wild .lbl { position: absolute; bottom: 8%; font: 900 3.8cqh Orbitron, sans-serif; font-style: normal; background: #f97316; color: #1a0d00; padding: 0 1.4cqh; border-radius: 4px; }
@keyframes stickIn { from { transform: scale(1.6); opacity: 0; } }
.expand-col { position: absolute; top: 0; bottom: 0; display: grid; place-items: center; background: linear-gradient(180deg, rgba(251, 191, 36, .25), rgba(120, 53, 15, .6)); border: 2px solid var(--gold); border-radius: 10px; box-shadow: 0 0 30px var(--gold), inset 0 0 30px rgba(251, 191, 36, .5); animation: expand .5s cubic-bezier(.3, 1.4, .5, 1) both; }
.expand-col .g { font-size: 34cqh; filter: drop-shadow(0 0 20px var(--gold)); }
@keyframes expand { from { transform: scaleY(.33); opacity: .2; } }
.mult-pop { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 900 30cqh Orbitron, sans-serif; color: #fff; text-shadow: 0 0 20px var(--pink), 0 0 50px var(--pink); animation: multPop 1.1s ease-out both; }
@keyframes multPop { 0% { transform: translate(-50%, -50%) scale(.3); opacity: 0; } 30% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; } 100% { transform: translate(-50%, -80%) scale(1); opacity: 0; } }

/* ---- win bar & controls ---- */
.win-bar { display: flex; justify-content: center; align-items: center; gap: 12px; min-height: 40px; margin: 10px 0 6px; }
.win-bar .msg { color: #b8c2d4; font-weight: 600; font-size: 14px; }
.win-amt { font: 900 22px Orbitron, sans-serif; color: var(--gold); text-shadow: 0 0 16px rgba(251, 191, 36, .7); font-variant-numeric: tabular-nums; }

.controls { display: grid; grid-template-columns: 1fr auto auto 1fr; align-items: center; gap: 18px; padding: 12px 16px; border-radius: 16px; background: rgba(0, 0, 0, .35); border: 1px solid rgba(255, 255, 255, .07); }
.ctl-info { display: flex; gap: 20px; }
.ctl-group label { display: block; font-size: 10px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
.ctl-group b { font-size: 16px; font-variant-numeric: tabular-nums; }
.ctl-group.center { text-align: center; min-width: 72px; }
.ctl-bet { display: flex; align-items: center; gap: 10px; }
.round-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--panel-3); font-size: 20px; font-weight: 700; transition: .15s; }
.round-btn:hover { background: #3d2c30; }
.spin-btn {
  position: relative; width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #ff7a88, var(--green) 45%, #8f0014);
  color: #fff; box-shadow: 0 0 0 4px rgba(0, 0, 0, .4), 0 0 0 6px rgba(255, 35, 64, .35), 0 0 34px rgba(255, 35, 64, .55);
  transition: transform .15s, filter .2s;
}
.spin-btn svg { width: 40px; height: 40px; transition: transform .5s; }
.spin-btn:hover { transform: scale(1.05); }
.spin-btn:active { transform: scale(.94); }
.slot.busy .spin-btn { filter: grayscale(.6) brightness(.75); }
.slot.busy .spin-btn svg { animation: spinIcon .6s linear infinite; }
.slot.auto-on .spin-btn { background: radial-gradient(circle at 35% 30%, #ff7ab8, var(--pink) 45%, #9d174d); box-shadow: 0 0 0 4px rgba(0, 0, 0, .4), 0 0 0 6px rgba(244, 63, 158, .4), 0 0 34px rgba(244, 63, 158, .6); color: #fff; }
.auto-count { position: absolute; font: 900 16px Orbitron, sans-serif; }
.slot.auto-on .spin-btn svg { opacity: .25; }
@keyframes spinIcon { to { transform: rotate(-360deg); } }
.ctl-opts { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.opt { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 52px; padding: 7px 8px; border-radius: 10px; background: var(--panel-2); font-size: 16px; transition: .15s; }
.opt span { font-size: 10px; font-weight: 700; color: var(--muted); }
.opt:hover { background: var(--panel-3); }
.opt.on { background: rgba(250, 204, 21, .15); box-shadow: inset 0 0 0 1px var(--gold); }
.opt.buy { background: linear-gradient(180deg, #7c3aed, #5b21b6); box-shadow: 0 0 16px rgba(124, 58, 237, .5); }
.opt.buy span { color: #e9d5ff; }
.slot.busy .ctl-bet, .slot.busy .opt.buy, .slot.busy [data-act="auto"]:not(.on) { opacity: .5; pointer-events: none; }
.slot.auto-on [data-act="auto"] { opacity: 1 !important; pointer-events: auto !important; }

/* ---- overlays ---- */
.slot-overlay {
  position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  text-align: center; background: radial-gradient(circle, rgba(10, 6, 25, .7), rgba(3, 4, 10, .92)); backdrop-filter: blur(3px);
  animation: ovIn .35s ease both; cursor: pointer; padding: 20px;
}
.slot-overlay.out { animation: ovOut .3s ease both; }
@keyframes ovIn { from { opacity: 0; } }
@keyframes ovOut { to { opacity: 0; transform: scale(1.04); } }
.intro-glyph { font-size: 90px; filter: drop-shadow(0 0 30px var(--accent)); animation: introGlyph 1.2s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes introGlyph { from { transform: scale(0) rotate(-180deg); } }
.slot-overlay h3 { font: 900 clamp(28px, 5vw, 48px) Orbitron, sans-serif; background: linear-gradient(180deg, #fff, var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 20px var(--accent)); animation: titleIn .6s cubic-bezier(.3, 1.6, .5, 1) .1s both; }
@keyframes titleIn { from { transform: scale(2.2); opacity: 0; } }
.slot-overlay p { margin: 0; color: #d1d9e6; font-weight: 600; font-size: 17px; }
.slot-overlay small { color: var(--muted); margin-top: 10px; }
.slot-overlay.grand h3 { background: linear-gradient(180deg, #fff7d6, #fbbf24, #b45309); -webkit-background-clip: text; background-clip: text; }
.slot-overlay.grand p { font: 900 34px Orbitron, sans-serif; color: var(--gold); }

.bigwin .rays { position: absolute; inset: -50%; background: repeating-conic-gradient(from 0deg, rgba(251, 191, 36, .12) 0 10deg, transparent 10deg 20deg); animation: rays 12s linear infinite; z-index: -1; }
@keyframes rays { to { transform: rotate(360deg); } }
.bw-amt { font: 900 clamp(36px, 7vw, 68px) Orbitron, sans-serif; color: #fff7d6; text-shadow: 0 0 10px var(--gold), 0 0 40px #f59e0b, 0 4px 0 #92400e; font-variant-numeric: tabular-nums; animation: bwPulse 1s ease-in-out infinite; }
@keyframes bwPulse { 50% { transform: scale(1.05); } }
.bigwin.mega h3 { background: linear-gradient(180deg, #fff, #f43f9e); -webkit-background-clip: text; background-clip: text; }
.bigwin.epic h3 { background: linear-gradient(180deg, #fff, #a855f7); -webkit-background-clip: text; background-clip: text; }
.bigwin.legend h3 { background: linear-gradient(90deg, #22d3ee, #a855f7, #f43f9e, #fbbf24); -webkit-background-clip: text; background-clip: text; }
.tier-tag { padding: 4px 14px; border-radius: 999px; background: var(--gold); color: #1a1200; font-weight: 900; letter-spacing: 1px; }

.reveal small { font-weight: 900; letter-spacing: 3px; color: var(--gold); }
.reveal-box { width: 140px; height: 140px; display: grid; place-items: center; border-radius: 20px; border: 3px solid var(--gold); background: radial-gradient(circle, rgba(251, 191, 36, .25), rgba(0, 0, 0, .5)); box-shadow: 0 0 40px rgba(251, 191, 36, .5); }
.reveal-box .g { font-size: 84px; }
.reveal.done .reveal-box { animation: revealDone .6s cubic-bezier(.3, 1.8, .5, 1); box-shadow: 0 0 80px var(--gold); }
@keyframes revealDone { 40% { transform: scale(1.3); } }

/* ============ Hold & Spin ============ */
.hs-board {
  position: absolute; inset: 0; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(3, 1fr);
  gap: 5px; padding: 5px; pointer-events: auto;
  background: radial-gradient(ellipse at 50% 100%, rgba(245, 158, 11, .2), transparent 60%), #07060f;
  animation: ovIn .5s ease both;
}
.hs-board.out { animation: ovOut .3s ease both; }
.hs-cell { position: relative; border-radius: 10px; overflow: hidden; container-type: size; background: rgba(255, 255, 255, .03); border: 1px solid rgba(255, 255, 255, .06); transition: box-shadow .3s; }
.hs-empty { position: absolute; inset: 0; background: repeating-linear-gradient(45deg, rgba(255, 255, 255, .015) 0 8px, transparent 8px 16px); }
.hs-cell.spinning { border-color: rgba(34, 211, 238, .3); }
.hs-reel { position: absolute; left: 0; right: 0; top: 0; display: flex; flex-direction: column; animation: hsReel .32s linear infinite; filter: blur(2px); opacity: .55; }
.hs-reel span { height: 100cqh; display: grid; place-items: center; font-size: 50cqh; }
@keyframes hsReel { to { transform: translateY(-500cqh); } }
.hs-sym { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1cqh; border-radius: 10px; }
.hs-sym .g { font-size: 46cqh; line-height: 1; filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .6)); }
.hs-sym small { font: 900 9cqh Orbitron, sans-serif; letter-spacing: .1em; opacity: .9; }
.hs-sym b { font: 900 14cqh Orbitron, sans-serif; color: #fff7d6; text-shadow: 0 0 8px rgba(245, 158, 11, .9), 0 2px 0 rgba(0, 0, 0, .6); font-variant-numeric: tabular-nums; }
.hs-sym .stars { position: absolute; top: 4cqh; right: 6cqh; font-style: normal; color: var(--gold); font-size: 10cqh; text-shadow: 0 0 6px var(--gold); }
.hs-sym.coin { background: radial-gradient(circle, rgba(251, 191, 36, .35), rgba(120, 53, 15, .45)); box-shadow: inset 0 0 0 2px rgba(251, 191, 36, .6), inset 0 0 24px rgba(251, 191, 36, .35); }
.hs-sym.coin .g { font-size: 40cqh; animation: coinSpin 3s ease-in-out infinite; }
@keyframes coinSpin { 0%, 70%, 100% { transform: rotateY(0); } 85% { transform: rotateY(180deg); } }
.hs-sym.house { box-shadow: inset 0 0 0 2px var(--hc), inset 0 0 26px var(--hg); background: var(--hb); }
.hs-sym.house small { color: var(--hc); }
.h-straw { --hc: #facc15; --hg: rgba(250, 204, 21, .35); --hb: linear-gradient(180deg, rgba(161, 98, 7, .35), rgba(66, 32, 6, .6)); }
.h-wood { --hc: #d97706; --hg: rgba(217, 119, 6, .45); --hb: repeating-linear-gradient(0deg, rgba(120, 53, 15, .55) 0 6px, rgba(146, 64, 14, .45) 6px 12px); }
.h-brick { --hc: #f87171; --hg: rgba(248, 113, 113, .45);
  --hb: repeating-linear-gradient(0deg, transparent 0 9px, rgba(0, 0, 0, .35) 9px 11px), repeating-linear-gradient(90deg, rgba(153, 27, 27, .6) 0 18px, rgba(127, 29, 29, .7) 18px 20px); }
.h-castle { --hc: #fde047; --hg: rgba(253, 224, 71, .6); --hb: radial-gradient(circle, rgba(253, 224, 71, .4), rgba(88, 28, 135, .6)); }
.h-castle .g { animation: castleGlow 1.6s ease-in-out infinite; }
@keyframes castleGlow { 50% { filter: drop-shadow(0 0 16px #fde047); transform: scale(1.06); } }
.hs-sym.wolf { background: radial-gradient(circle, rgba(239, 68, 68, .35), rgba(30, 27, 75, .7)); box-shadow: inset 0 0 0 2px #ef4444, inset 0 0 24px rgba(239, 68, 68, .4); }
.hs-sym.wolf small { color: #fca5a5; }
.hs-sym.pig { background: radial-gradient(circle, rgba(244, 114, 182, .4), rgba(80, 7, 36, .6)); box-shadow: inset 0 0 0 2px #f472b6, inset 0 0 24px rgba(244, 114, 182, .4); }
.hs-sym.pig small { color: #f9a8d4; }
.hs-sym.jp { background: radial-gradient(circle, color-mix(in srgb, var(--jc) 40%, transparent), rgba(0, 0, 0, .6)); box-shadow: inset 0 0 0 2px var(--jc), inset 0 0 26px var(--jc); }
.hs-sym.jp small { color: var(--jc); }
.hs-cell.pop .hs-sym { animation: hsPop .55s cubic-bezier(.3, 1.8, .5, 1); }
@keyframes hsPop { 0% { transform: scale(.2) rotate(-20deg); opacity: 0; } 60% { transform: scale(1.15); } }
.hs-cell.upgrade .hs-sym { animation: hsUpgrade .7s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes hsUpgrade { 0% { transform: scale(.4) translateY(30%); filter: brightness(3); } 60% { transform: scale(1.2); } }
.hs-cell.shake .hs-sym { animation: houseShake .26s linear; }
@keyframes houseShake { 25% { transform: translateX(-8%) rotate(-6deg); } 50% { transform: translateX(8%) rotate(5deg); } 75% { transform: translateX(-4%) rotate(-3deg); } }
.hs-cell.focus { box-shadow: 0 0 0 2px #fff, 0 0 30px #ef4444; z-index: 2; }
.hs-cell.flash { box-shadow: 0 0 0 2px #f9a8d4, 0 0 20px #f472b6; }
.hs-cell.collect .hs-sym { animation: collect .4s ease both; }
@keyframes collect { 50% { transform: scale(1.15); filter: brightness(1.8); } 100% { filter: brightness(.6) saturate(.5); } }

/* ---- the wolf actor ---- */
.wolf-actor { position: absolute; inset: 0; z-index: 15; pointer-events: none; display: flex; align-items: center; }
.wolf-wrap { position: relative; width: min(42%, 300px); aspect-ratio: 1; transform: translateX(-120%) rotate(-10deg); transition: transform .65s cubic-bezier(.3, 1.4, .5, 1); }
.wolf-actor.enter .wolf-wrap { transform: translateX(-12%) rotate(0); }
.wolf-actor.leave .wolf-wrap { transform: translateX(-130%) rotate(-15deg); transition-duration: .45s; transition-timing-function: ease-in; }
.wolf-glow { position: absolute; inset: 10%; border-radius: 50%; background: radial-gradient(circle, rgba(239, 68, 68, .55), transparent 70%); filter: blur(10px); animation: glowPulse 1s ease-in-out infinite; }
@keyframes glowPulse { 50% { opacity: .5; transform: scale(1.1); } }
.wolf-face { position: absolute; inset: 0; display: grid; place-items: center; font-size: min(18vw, 210px); line-height: 1; transform: scaleX(-1); filter: drop-shadow(0 0 30px rgba(239, 68, 68, .7)) drop-shadow(0 20px 30px rgba(0, 0, 0, .7)); transition: transform .5s; }
.wolf-actor.inhale .wolf-face { transform: scaleX(-1) scale(1.16) translateY(-4%); }
.wolf-actor.blow .wolf-face { transform: scaleX(-1) scale(1.05) rotate(-8deg) translateX(-6%); animation: blowShake .12s linear infinite; }
@keyframes blowShake { 50% { translate: 2px -1px; } }
.cheek { position: absolute; top: 55%; width: 18%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, rgba(251, 113, 133, .65), transparent 70%); opacity: 0; transition: opacity .3s, transform .5s; }
.cheek.l { left: 40%; } .cheek.r { left: 62%; }
.wolf-actor.inhale .cheek { opacity: 1; transform: scale(1.6); }
.breath { position: absolute; left: 78%; top: 40%; width: 0; height: 30%; border-radius: 0 50% 50% 0; background: linear-gradient(90deg, rgba(224, 242, 254, .85), rgba(186, 230, 253, 0)); filter: blur(6px); }
.wolf-actor.blow .breath { animation: breath .9s ease-out forwards; }
@keyframes breath { to { width: 260%; height: 90%; top: 5%; opacity: .2; } }
.huff-text { position: absolute; left: 38%; top: 16%; font: 900 clamp(26px, 5vw, 54px) Orbitron, sans-serif; color: #fff; text-shadow: 0 0 20px #ef4444, 0 0 40px #ef4444, 0 4px 0 #7f1d1d; opacity: 0; transform: scale(.4) rotate(-6deg); transition: opacity .2s, transform .35s cubic-bezier(.3, 1.8, .5, 1); }
.huff-text.show { opacity: 1; transform: scale(1) rotate(-6deg); }
.huff-text.big { font-size: clamp(34px, 7vw, 76px); color: #fde047; }
.huff-text.small { font-size: clamp(16px, 2.6vw, 26px); }

/* ============ Modals & toasts ============ */
.modal-back { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; background: rgba(3, 5, 10, .7); backdrop-filter: blur(6px); opacity: 0; transition: opacity .2s; }
.modal-back.show { opacity: 1; }
.modal { position: relative; width: min(420px, 100%); max-height: 88vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 24px; box-shadow: var(--shadow); transform: translateY(12px) scale(.97); transition: transform .25s cubic-bezier(.2, .8, .2, 1); }
.modal.wide { width: min(720px, 100%); }
.modal-back.show .modal { transform: none; }
.modal h3 { font-size: 20px; margin-bottom: 8px; }
.modal h4 { margin: 20px 0 8px; color: var(--green); font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
.modal p { margin: 6px 0; }
.modal-x { position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border-radius: 8px; background: var(--panel-2); color: var(--muted); }
.choice-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 14px; }
.row-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
.buy-card { text-align: center; padding: 16px; border-radius: 14px; background: var(--panel-2); }
.buy-card .intro-glyph { font-size: 64px; }
.buy-card .price { display: block; font: 900 28px Orbitron, sans-serif; color: var(--gold); }
.paytable { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.pay-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: var(--panel-2); }
.pay-sym { position: relative; font-size: 34px; width: 46px; text-align: center; }
.pay-sym.card { font: 900 28px Orbitron, sans-serif; color: var(--cc); text-shadow: 0 0 10px var(--cc); }
.pay-sym i { position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); font: 900 8px Orbitron, sans-serif; font-style: normal; background: var(--gold); color: #000; padding: 0 4px; border-radius: 3px; }
.pay-vals { font-size: 12px; flex: 1; }
.pay-vals div { display: flex; justify-content: space-between; }
.pay-vals span { color: var(--muted); }
.rules { padding-left: 18px; margin: 6px 0; }
.rules li { margin: 6px 0; }

.toasts { position: fixed; top: 76px; right: 16px; z-index: 120; display: flex; flex-direction: column; gap: 8px; }
.toast { padding: 12px 16px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); box-shadow: var(--shadow); font-weight: 600; transform: translateX(120%); transition: transform .3s cubic-bezier(.2, .8, .2, 1); }
.toast.show { transform: none; }
.toast.warn { border-color: var(--gold); }
.toast.ok { border-color: var(--green); }

.fx-layer { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 90; }

/* ============ VIP / daily ============ */
.vip-card { background: radial-gradient(500px 200px at 0% 0%, color-mix(in srgb, var(--vip) 25%, transparent), transparent 70%), var(--panel); }
.vip-head { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
.vip-badge { width: 64px; height: 64px; display: grid; place-items: center; font-size: 34px; border-radius: 18px; background: var(--panel-2); box-shadow: 0 0 30px color-mix(in srgb, var(--vip) 50%, transparent); }
.vip-head h1 { font: 900 30px Orbitron, sans-serif; color: var(--vip); }
.tier-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.tier { padding: 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
.tier b { display: block; color: var(--vip); font-size: 18px; }
.tier small { color: var(--muted); }
.tier.on { border-color: var(--vip); box-shadow: 0 0 20px color-mix(in srgb, var(--vip) 35%, transparent); }
.daily { max-width: 520px; margin: 0 auto; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 36px 24px; }
.daily h1 { font: 900 28px Orbitron, sans-serif; }
.daily-gift { font-size: 90px; filter: grayscale(.8); }
.daily-gift.ready { filter: drop-shadow(0 0 30px rgba(255, 35, 64, .5)); animation: float 2.4s ease-in-out infinite; }
.sep { width: 100%; height: 1px; background: var(--line); margin: 14px 0; }
.prose { max-width: 760px; }
.prose h1 { font: 900 26px Orbitron, sans-serif; margin-bottom: 10px; }

/* ============ Responsive ============ */
@media (max-width: 900px) {
  :root { --top: 58px; }
  .side { transform: translateX(-105%); box-shadow: var(--shadow); }
  body.side-open .side { transform: none; }
  body.side-open .side-scrim { display: block; position: fixed; inset: 0; z-index: 35; background: rgba(0, 0, 0, .55); }
  .top, .view, .foot { margin-left: 0; }
  .top { padding: 0 16px; }
  .burger, .logo.mobile { display: grid; place-items: center; padding: 0; }
  .top-right { position: static; margin-left: 8px; }
  .demo-tag { display: none; }
  .top-wallet { margin: 0 0 0 auto; }
  .view { padding: 16px; }
  .foot { padding-bottom: 90px; }
  .hero, .two-col { grid-template-columns: 1fr; }
  .hero-main { padding: 24px; min-height: 280px; }
  .hero-art { opacity: .45; width: 70%; }
  .hero-side { grid-template-columns: repeat(3, minmax(220px, 1fr)); overflow-x: auto; }
  .game-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .thumb .a0 { font-size: 64px; } .thumb .a1, .thumb .a2 { font-size: 34px; }
  .bottom-nav { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(17, 14, 16, .96); backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
  .bottom-nav a { flex: 1; display: flex; flex-direction: column; align-items: center; font-size: 11px; font-weight: 600; color: var(--muted); padding: 4px; border-radius: 10px; }
  .bottom-nav a span { font-size: 20px; }
  .bottom-nav a.on { color: #fff; background: var(--panel-2); }
}
@media (max-width: 600px) {
  .slot { padding: 10px 8px 10px; border-radius: 16px; }
  .slot-frame { padding: 5px; }
  .reels { gap: 2px; }
  .slot-title h2 { font-size: 16px; }
  .slot-title .art { font-size: 28px; }
  .jackpots { width: 100%; }
  .jp { flex: 1; min-width: 0; padding: 4px; }
  .jp b { font-size: 11px; }
  .spin-btn { width: 70px; height: 70px; }
  .controls { padding: 10px; }
  .opt { min-width: 0; flex: 1; padding: 6px 2px; }
  .choice-grid { grid-template-columns: repeat(3, 1fr); }
  .stat-grid { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ============ Lobby rows & original game cards ============ */
.game-row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(170px, 190px); gap: 16px; overflow-x: auto; padding: 4px 2px 12px; scroll-snap-type: x proximity; scrollbar-width: thin; }
.game-row .game-card { scroll-snap-align: start; }
.sec-head .more { color: var(--muted); font-weight: 600; font-size: 14px; }
.sec-head .more:hover { color: #fff; }
.thumb .scene { position: absolute; inset: 0; width: 100%; height: 100%; transition: transform .5s cubic-bezier(.2, .8, .2, 1); filter: drop-shadow(0 8px 18px rgba(0, 0, 0, .35)); }
.game-card:hover .scene { transform: scale(1.06) translateY(-3%); }
.game-card.orig { --accent-glow: color-mix(in srgb, var(--accent) 55%, transparent); }
.badge.new { background: var(--green); color: #fff; }
.tile-art { position: relative; flex: none; width: 54px; height: 72px; border-radius: 10px; overflow: hidden; display: block; }
.tile-art .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.promo-tile:hover { border-color: var(--accent); box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 35%, transparent); }
.promo-tile.p1, .promo-tile.p2, .promo-tile.p3 { --accent-glow: transparent; }
.gdot { width: 14px !important; height: 14px; border-radius: 4px; flex: none; box-shadow: 0 0 8px rgba(255, 255, 255, .12); }
.side-games a { font-size: 14px; padding: 8px 12px; }
.table-scroll { overflow-x: auto; }

/* ============ Original game page ============ */
.side-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.side-stats div { background: var(--panel-2); border-radius: 12px; padding: 12px; }
.side-stats small { display: block; color: var(--muted); font-size: 12px; }
.side-stats b { font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--panel-3); }
.dots i.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
.feat-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.feat-chips span { padding: 6px 11px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); font-size: 13px; font-weight: 600; }
@media (max-width: 900px) { .crumbs { display: none; } .game-row { grid-auto-columns: 150px; gap: 12px; } }
.refill-bal { padding: 14px 24px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); }
.refill-bal small { display: block; color: var(--muted); font-size: 12px; }
.refill-bal b { font: 900 26px Orbitron, sans-serif; font-variant-numeric: tabular-nums; }
.ad-btn { background: linear-gradient(180deg, #f59e0b, #d97706); color: #1a0f00; box-shadow: 0 0 0 1px rgba(245, 158, 11, .5), 0 6px 24px rgba(245, 158, 11, .3); }
.ad-btn span { padding: 2px 10px; border-radius: 999px; background: rgba(0, 0, 0, .2); font-size: 14px; }

/* ============ Game covers (key art) ============ */
.thumb { background: #05060c; }
.thumb .cover { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transition: transform .5s cubic-bezier(.2, .8, .2, 1), filter .3s; }
.game-card:hover .thumb .cover { transform: scale(1.05); filter: brightness(1.08); }
.thumb::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08), inset 0 -40px 60px -30px rgba(0, 0, 0, .4); }
.thumb::before { content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none; background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, .22) 48%, transparent 60%); transform: translateX(-120%); transition: transform .8s ease; }
.game-card:hover .thumb::before { transform: translateX(120%); }
.thumb .badge { left: 10px; right: auto; z-index: 3; }
/* poster cards: art fills the card, name + provider printed on it, likes top right */
.game-card { position: relative; }
.like { position: absolute; top: 8px; right: 8px; z-index: 4; display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 10px; color: #fff; font: 700 14px/1 Inter, sans-serif; font-variant-numeric: tabular-nums; text-shadow: 0 1px 4px rgba(0, 0, 0, .55); transition: transform .15s; }
.like span { position: static; filter: none; transform: none; }
.like svg { width: 22px; height: 22px; fill: #fff; stroke: none; filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .45)); transition: fill .2s; }
.like:hover svg { fill: #ffd0d6; }
.like.on svg { fill: #ff2340; filter: drop-shadow(0 0 6px rgba(255, 35, 64, .8)) drop-shadow(0 1px 2px rgba(0, 0, 0, .5)); }
.like.pop svg { animation: likePop .45s cubic-bezier(.3, 1.8, .5, 1); }
@keyframes likePop { 40% { transform: scale(1.45); } }
/* square lobby posters */
.game-card .thumb { aspect-ratio: 1; border-radius: 22px; border: 0; box-shadow: 0 8px 24px rgba(0, 0, 0, .35); }
.game-card .thumb::after { box-shadow: none; }
.game-card:hover .thumb { box-shadow: 0 12px 30px rgba(0, 0, 0, .5), 0 0 0 2px var(--green); }
.game-card .play { z-index: 3; }
.meta small { color: var(--muted); letter-spacing: .2px; }
.tile-art { width: 64px; height: 64px; border-radius: 14px; box-shadow: 0 6px 16px rgba(0, 0, 0, .5); }
.tile-art .cover { width: 100%; height: 100%; display: block; }
.hero-art { display: grid; place-items: center; }
.hero-poster { width: min(250px, 38%); aspect-ratio: 1; border-radius: 26px; position: absolute; right: 8%; top: 50%; transform: translateY(-50%) rotate(4deg); border-radius: 18px; overflow: hidden; box-shadow: 0 30px 60px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .12), 0 0 60px rgba(251, 191, 36, .25); animation: posterFloat 6s ease-in-out infinite; }
.hero-poster .cover { width: 100%; height: 100%; display: block; }
@keyframes posterFloat { 50% { transform: translateY(-53%) rotate(2deg); } }
.gart { width: 48px; height: 48px; border-radius: 12px; }
.gart .cover { width: 100%; height: 100%; display: block; }
.slot-title .prov { display: block; font-style: normal; font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(255, 255, 255, .45); margin-top: 2px; }
@media (max-width: 900px) { .hero-poster { width: 34%; right: 4%; opacity: .9; } }
.game-card .meta b, .game-card .meta small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 600px) { .hero-poster { display: none; } }

/* ============ Player: pseudo gate, header chip, level-up, profile ============ */
body.gated { overflow: hidden; }
.gate { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; padding: 16px; overflow-y: auto; opacity: 0; transition: opacity .3s;
  background: radial-gradient(700px 400px at 20% 10%, rgba(255, 35, 64, .35), transparent 60%), radial-gradient(700px 400px at 90% 90%, rgba(255, 35, 64, .18), transparent 60%), rgba(8, 6, 7, .95); backdrop-filter: blur(10px); }
.gate.show { opacity: 1; }
.gate-card { width: min(440px, 100%); padding: 32px 28px 22px; border-radius: 22px; text-align: center; background: linear-gradient(180deg, #1d1517, #110d0e); border: 1px solid var(--line); box-shadow: 0 30px 80px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 35, 64, .15); transform: translateY(16px) scale(.97); transition: transform .4s cubic-bezier(.2, 1.4, .4, 1); }
.gate.show .gate-card { transform: none; }
.gate-logo { display: inline-flex; align-items: center; gap: 10px; font: 900 20px Orbitron, sans-serif; letter-spacing: 1px; margin-bottom: 18px; }
.gate-logo em { font-style: normal; color: var(--green); }
.gate h1 { font: 900 24px Orbitron, sans-serif; margin-bottom: 6px; }
.gate p { margin: 0 0 18px; font-size: 14px; }
.gate-form { display: flex; flex-direction: column; gap: 8px; }
.gate-input { width: 100%; padding: 15px 16px; border-radius: 14px; border: 2px solid var(--line); background: #0c0a0b; color: #fff; font: 700 18px Inter, sans-serif; text-align: center; outline: none; transition: border-color .2s, box-shadow .2s; }
.gate-input:focus { border-color: var(--green); box-shadow: 0 0 0 4px rgba(255, 35, 64, .15); }
.gate-input.bad { border-color: var(--red); animation: gateShake .35s; }
@keyframes gateShake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.gate-err { min-height: 16px; color: var(--red); font-weight: 600; font-size: 13px; }
.gate-list { margin-top: 20px; text-align: left; }
.gate-list > small { display: block; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; }
.gate-list > div { display: flex; flex-wrap: wrap; gap: 8px; }
.gate-chip { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); transition: border-color .2s, transform .2s; }
.gate-chip:hover { border-color: var(--green); transform: translateY(-1px); }
.gate-chip b { font-size: 14px; }
.gate-chip i { font-style: normal; font-size: 12px; color: var(--muted); }
.gate-note { margin: 18px 0 0 !important; font-size: 11px; color: var(--muted); }
.locked-game { text-align: center; padding: 60px 20px; }

.me-chip { display: flex; align-items: center; gap: 10px; padding: 4px 12px 4px 4px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); position: relative; transition: border-color .2s; }
.me-chip:empty { display: none; }
.me-chip:hover { border-color: var(--rk); }
.lvl-ring { --p: 0%; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; background: conic-gradient(var(--rk) var(--p), rgba(255, 255, 255, .1) 0); box-shadow: 0 0 12px color-mix(in srgb, var(--rk) 40%, transparent); }
.lvl-ring b { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: #120e0f; font: 900 13px Orbitron, sans-serif; color: var(--rk); }
.me-name { display: flex; flex-direction: column; line-height: 1.15; max-width: 140px; }
.me-name b { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me-name small { font-size: 11px; color: var(--rk); font-weight: 700; }
.gift-dot { position: absolute; top: -6px; right: -6px; font-style: normal; font-size: 16px; animation: giftBob 1.4s ease-in-out infinite; filter: drop-shadow(0 0 6px rgba(255, 35, 64, .8)); }
@keyframes giftBob { 50% { transform: translateY(-3px) rotate(-10deg); } }
.side-vip { --rk: var(--gold); }
.side-me { display: flex; align-items: center; gap: 10px; }
.side-me small { display: block; color: var(--muted); font-size: 12px; }
.side-me b { color: var(--rk); font-size: 14px; }
.side-vip .progress div { background: linear-gradient(90deg, var(--rk), #fff); box-shadow: 0 0 10px var(--rk); }
.side-xp { display: block; margin-top: 6px; font-size: 11px; color: var(--muted); }

.lvl-pop { position: fixed; left: 50%; top: 76px; z-index: 150; display: flex; align-items: center; gap: 14px; padding: 12px 22px 12px 14px; border-radius: 18px; pointer-events: none;
  background: linear-gradient(180deg, #221a1c, #120e0f); border: 1px solid var(--rk); box-shadow: 0 0 0 1px rgba(0, 0, 0, .5), 0 18px 50px rgba(0, 0, 0, .6), 0 0 40px color-mix(in srgb, var(--rk) 45%, transparent);
  transform: translate(-50%, -30px) scale(.9); opacity: 0; transition: transform .45s cubic-bezier(.2, 1.5, .4, 1), opacity .3s; }
.lvl-pop.show { transform: translate(-50%, 0); opacity: 1; }
.lvl-pop small { display: block; font-size: 11px; font-weight: 800; letter-spacing: 2px; color: var(--rk); }
.lvl-pop b { display: block; font: 900 20px Orbitron, sans-serif; color: #fff; }
.lvl-pop em { font-style: normal; font-weight: 800; color: var(--green); font-size: 16px; }
.lvl-pop.rank { padding: 18px 30px 18px 18px; }
.lvl-pop.rank b { font-size: 24px; background: linear-gradient(180deg, #fff, var(--rk)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lvl-pop .rank-badge { filter: drop-shadow(0 0 14px var(--rk)); animation: badgeIn .8s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes badgeIn { from { transform: scale(.2) rotate(-40deg); } }

.me-hero { position: relative; display: flex; align-items: center; gap: 24px; padding: 26px; margin-bottom: 20px; overflow: hidden;
  background: radial-gradient(600px 240px at 0% 0%, color-mix(in srgb, var(--rk) 28%, transparent), transparent 70%), var(--panel); border-color: color-mix(in srgb, var(--rk) 45%, var(--line)); }
.me-badge .rank-badge { filter: drop-shadow(0 0 20px color-mix(in srgb, var(--rk) 70%, transparent)); animation: float 3s ease-in-out infinite; }
.me-main { flex: 1; min-width: 0; }
.me-main h1 { font: 900 30px Orbitron, sans-serif; overflow-wrap: anywhere; }
.me-rank { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 6px 0 12px; }
.me-rank b { padding: 3px 12px; border-radius: 999px; background: var(--rk); color: #10131a; font-weight: 900; letter-spacing: .5px; }
.me-rank span { font-weight: 700; }
.boost-tag { padding: 3px 10px; border-radius: 999px; background: rgba(245, 158, 11, .15); color: #fbbf24; font-size: 13px; }
.boost-tag em { font-style: normal; font-variant-numeric: tabular-nums; }
.xp-bar { height: 14px; border-radius: 10px; background: var(--panel-3); overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .05); }
.xp-bar div { height: 100%; border-radius: 10px; background: linear-gradient(90deg, var(--rkd), var(--rk), #fff); box-shadow: 0 0 14px var(--rk); transition: width .8s; }
.xp-row { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 8px; font-size: 13px; color: var(--muted); }
.xp-row b { color: var(--green); }
.me-switch { align-self: flex-start; }

.daily-card { margin-bottom: 20px; }
.dc-head { display: flex; gap: 16px; align-items: center; margin-bottom: 16px; }
.dc-head h2 { font: 900 20px Orbitron, sans-serif; }
.dc-head p { margin: 4px 0 0; font-size: 14px; }
.dc-gift { font-size: 52px; filter: grayscale(.7); }
.daily-card.ready .dc-gift { filter: drop-shadow(0 0 20px rgba(255, 35, 64, .5)); animation: float 2.4s ease-in-out infinite; }
.daily-card.ready { border-color: rgba(255, 35, 64, .4); box-shadow: 0 0 30px rgba(255, 35, 64, .08); }
.streak { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 16px; }
.sd { padding: 10px 4px; border-radius: 12px; text-align: center; background: var(--panel-2); border: 1px solid var(--line); }
.sd small { display: block; font-size: 11px; color: var(--muted); font-weight: 700; }
.sd b { font-size: 15px; }
.sd.done { background: rgba(255, 35, 64, .1); border-color: rgba(255, 35, 64, .35); }
.sd.done b { color: var(--green); }
.sd.now { border-color: var(--gold); box-shadow: 0 0 18px rgba(251, 191, 36, .35); background: rgba(251, 191, 36, .1); animation: sdPulse 1.6s ease-in-out infinite; }
@keyframes sdPulse { 50% { box-shadow: 0 0 28px rgba(251, 191, 36, .6); } }
.sd.now b { color: var(--gold); }
.dc-act { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.dc-wait small { display: block; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
.dc-wait b { font: 900 28px Orbitron, sans-serif; font-variant-numeric: tabular-nums; }
.rank-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
.rank-card { position: relative; padding: 18px 14px; border-radius: 16px; text-align: center; background: radial-gradient(200px 120px at 50% 0%, color-mix(in srgb, var(--rk) 18%, transparent), transparent 70%), var(--panel); border: 1px solid var(--line); }
.rank-card b { display: block; margin-top: 6px; font: 900 18px Orbitron, sans-serif; color: var(--rk); }
.rank-card small { color: var(--muted); font-size: 12px; }
.rank-card ul { list-style: none; margin: 10px 0 0; padding: 0; font-size: 13px; display: grid; gap: 3px; }
.rank-card li { color: #cfd6e3; }
.rank-card.on { border-color: var(--rk); box-shadow: 0 0 26px color-mix(in srgb, var(--rk) 35%, transparent); }
.rank-card.locked .rank-badge { filter: grayscale(.85) brightness(.7); }
.rank-card.done::after { content: '✓'; position: absolute; top: 10px; right: 12px; color: var(--green); font-weight: 900; }
.rank-you { position: absolute; top: 10px; right: 10px; font-style: normal; font-size: 10px; font-weight: 900; padding: 2px 8px; border-radius: 999px; background: var(--rk); color: #10131a; }
.xp-rules { margin: 10px 0 16px; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; }
.ad-btn[disabled] { opacity: .5; cursor: not-allowed; }
.ad-btn span { font-weight: 700; }
@media (max-width: 900px) {
  .me-chip { padding: 3px; }
  .me-name { display: none; }
  .lvl-ring { width: 36px; height: 36px; }
  .lvl-ring b { width: 29px; height: 29px; font-size: 12px; }
  .lvl-pop { top: 66px; width: max-content; max-width: calc(100vw - 24px); }
}
@media (max-width: 600px) {
  .me-hero { flex-direction: column; text-align: center; padding: 22px 16px; }
  .me-rank, .xp-row { justify-content: center; }
  .me-switch { align-self: center; }
  .streak { grid-template-columns: repeat(4, 1fr); }
  .dc-head { flex-direction: column; text-align: center; }
}

.top-refill b { display: none; font-size: 22px; line-height: 1; }
@media (max-width: 600px) {
  .top { padding: 0 10px; gap: 8px; }
  .top-refill { padding: 8px 14px; }
  .top-refill span { display: none; }
  .top-refill b { display: block; }
  .balance { padding: 0 10px; }
}
/* Height reserved around the play area (header, title, controls); smaller in full screen. */
:root { --chrome: 460px; }
/* ============ Rebuilt games: shared cabinet ============ */
.gslot { --slot-bg: radial-gradient(520px 260px at 50% -5%, color-mix(in srgb, var(--accent) 34%, transparent), transparent 70%), linear-gradient(180deg, color-mix(in srgb, var(--accent2) 60%, #05060c) 0%, #070910 100%); }
.gslot .slot-bg { background: var(--slot-bg); }
.gart { width: 42px; height: 56px; border-radius: 10px; overflow: hidden; display: block; background: linear-gradient(165deg, var(--accent), var(--accent2)); box-shadow: 0 0 18px var(--accent-glow); filter: none !important; }
.gart svg { width: 100%; height: 100%; display: block; }
.art-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
.spin-btn.wide { width: auto; min-width: 150px; height: 64px; border-radius: 40px; padding: 0 26px; }
.spin-btn .main-label { font: 900 17px Orbitron, sans-serif; letter-spacing: 1px; }
.slot.busy .spin-btn.wide .main-label { opacity: .7; }
.g-overlay.slot-overlay { position: fixed; z-index: 85; }
.g-flash { position: fixed; inset: 0; z-index: 84; pointer-events: none; background: radial-gradient(circle, var(--fc), transparent 70%); animation: gFlash .55s ease-out forwards; }
@keyframes gFlash { from { opacity: 1; } to { opacity: 0; } }
.quake1 { animation: quake .45s linear 1; }
.pill.hot { color: #fff; border-color: var(--accent); box-shadow: 0 0 14px var(--accent-glow); }
.head-meters { display: flex; gap: 6px; flex-wrap: wrap; }
.meter { min-width: 78px; text-align: center; padding: 5px 10px; border-radius: 10px; background: rgba(0, 0, 0, .35); border: 1px solid color-mix(in srgb, var(--accent) 60%, transparent); }
.meter small { display: block; font-size: 9px; font-weight: 900; letter-spacing: 1.5px; color: var(--accent); text-transform: uppercase; }
.meter b { font: 800 14px Orbitron, sans-serif; font-variant-numeric: tabular-nums; }
.meter.bump, .bump { animation: bumpIt .5s cubic-bezier(.3, 1.8, .5, 1); }
@keyframes bumpIt { 40% { transform: scale(1.25); filter: brightness(1.6); } }

/* buy menu */
.buy-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.buy-item { display: flex; align-items: center; gap: 12px; text-align: left; padding: 14px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); transition: border-color .2s, transform .15s, box-shadow .2s; }
.buy-item:hover:not(:disabled) { border-color: var(--purple); box-shadow: 0 0 20px rgba(255, 35, 64, .3); transform: translateY(-2px); }
.buy-item:disabled { opacity: .45; cursor: not-allowed; }
.bi-ico { font-size: 26px; width: 40px; text-align: center; }
.bi-txt { flex: 1; min-width: 0; }
.bi-txt b { display: block; }
.bi-txt small { color: var(--muted); font-size: 12px; }
.bi-price { font: 900 15px Orbitron, sans-serif; color: var(--gold); white-space: nowrap; }

/* ============ Tumbling grid ============ */
.sg {
  display: grid; grid-template-columns: repeat(var(--cols), 1fr); grid-template-rows: repeat(var(--rows), 1fr); grid-auto-flow: column;
  gap: 4px; padding: 6px; margin: 0 auto; aspect-ratio: calc(var(--cols) / var(--rows));
  width: min(100%, calc((100vh - var(--chrome)) * var(--cols) / var(--rows))); min-width: min(100%, 240px); transition: box-shadow .3s;
}
.sg.tease { box-shadow: inset 0 0 0 2px var(--gold), inset 0 0 50px rgba(251, 191, 36, .45); border-radius: 12px; }
.sg-cell { position: relative; border-radius: 10px; overflow: hidden; container-type: size; background: linear-gradient(180deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .02)); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .05); transition: box-shadow .25s, background .3s; }
.sg-sym { position: absolute; inset: 0; display: grid; place-items: center; will-change: transform; }
.sg-sym svg { width: 88%; height: 88%; filter: drop-shadow(0 3px 6px rgba(0, 0, 0, .55)); }
.sg-sym .emo { font-size: 62cqh; line-height: 1; filter: drop-shadow(0 3px 6px rgba(0, 0, 0, .55)); }
.sg-cell.win { box-shadow: inset 0 0 0 2px var(--accent), 0 0 18px var(--accent), inset 0 0 18px var(--accent-glow); z-index: 1; }
.sg-cell.win .sg-sym svg, .sg-cell.win .sg-sym .emo { animation: winBounce .7s ease-in-out infinite; }
.sg-cell.lock { background: radial-gradient(circle, rgba(251, 191, 36, .32), rgba(120, 53, 15, .35)); box-shadow: inset 0 0 0 2px rgba(251, 191, 36, .75), inset 0 0 22px rgba(251, 191, 36, .35); }
.sg-cell.dim { opacity: .3; }
.sg-badge { position: absolute; top: 4%; right: 4%; z-index: 2; display: none; font: 900 17cqh/1 Orbitron, sans-serif; font-style: normal; padding: 3cqh 6cqh; border-radius: 6cqh; background: linear-gradient(180deg, #a855f7, #6d28d9); color: #fff; box-shadow: 0 0 10px rgba(168, 85, 247, .8); }
.sg-badge.on { display: block; animation: symPop .4s cubic-bezier(.3, 1.8, .5, 1); }
.sg-badge.t2 { background: linear-gradient(180deg, #22d3ee, #0369a1); box-shadow: 0 0 10px rgba(34, 211, 238, .8); }
.sg-badge.t3 { background: linear-gradient(180deg, #f472b6, #be185d); box-shadow: 0 0 12px rgba(244, 114, 182, .9); }
.sg-badge.t4 { background: linear-gradient(180deg, #fde047, #ca8a04); color: #1a1200; box-shadow: 0 0 14px rgba(250, 204, 21, .95); }

/* ============ Reel strips ============ */
.rs { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 4px; aspect-ratio: calc(var(--cols) / var(--rows)); margin: 0 auto; width: min(100%, calc((100vh - var(--chrome)) * var(--cols) / var(--rows))); min-width: min(100%, 240px); }
.rs-reel { position: relative; overflow: hidden; container-type: size; border-radius: 8px; background: linear-gradient(180deg, rgba(255, 255, 255, .03), rgba(255, 255, 255, .07) 50%, rgba(255, 255, 255, .03)); }
.rs-reel::before, .rs-reel::after { content: ''; position: absolute; left: 0; right: 0; height: 12%; z-index: 2; pointer-events: none; }
.rs-reel::before { top: 0; background: linear-gradient(rgba(3, 6, 12, .8), transparent); }
.rs-reel::after { bottom: 0; background: linear-gradient(transparent, rgba(3, 6, 12, .8)); }
.rs-strip { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
.rs-reel.spinning .rs-strip { filter: blur(2.5px) brightness(1.1); }
.rs-reel.tease { box-shadow: inset 0 0 0 2px var(--gold), inset 0 0 40px rgba(251, 191, 36, .55); }
.rs-reel.landed .rs-strip { animation: rsLand .25s ease-out; }
@keyframes rsLand { 40% { transform: translateY(2.5cqh); } }
.rs-cell { position: relative; height: calc(100cqh / var(--rows)); display: grid; place-items: center; transition: opacity .25s, filter .25s; }
.rs-cell svg { width: 84%; height: 84%; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .6)); }
.rs.has-win .rs-cell:not(.win) { opacity: .35; filter: saturate(.4); }
.rs-cell.win { z-index: 1; }
.rs-cell.win::before { content: ''; position: absolute; inset: 5%; border-radius: 12px; border: 2px solid var(--accent); box-shadow: 0 0 16px var(--accent), inset 0 0 16px var(--accent-glow); animation: winBox 1s ease-in-out infinite; }
.rs-cell.win svg { animation: winBounce 1s ease-in-out infinite; }
.rs-cell .cv { position: absolute; bottom: 7%; left: 50%; transform: translateX(-50%); font: 900 calc(16cqh / var(--rows) * 3) Orbitron, sans-serif; color: #fff7d6; text-shadow: 0 0 6px #f59e0b, 0 2px 0 #92400e; white-space: nowrap; }
.rs-cell.pop svg { animation: symPop .5s cubic-bezier(.3, 1.8, .5, 1); }

/* ============ Hold & Spin board (generic) ============ */
.hsb { position: absolute; inset: 0; z-index: 3; display: grid; grid-template-columns: repeat(var(--cols), 1fr); grid-template-rows: repeat(var(--rows), 1fr); gap: 5px; padding: 5px;
  background: radial-gradient(ellipse at 50% 100%, color-mix(in srgb, var(--accent) 25%, transparent), transparent 60%), #07060f; animation: ovIn .45s ease both; pointer-events: auto; }
.hsb.out { animation: ovOut .3s ease both; }
.hsb .hs-cell svg { width: 70%; height: 62%; filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .6)); }
.hsb .hs-sym { gap: 0; }

@media (max-width: 600px) {
  .meter { min-width: 0; flex: 1; padding: 4px 6px; }
}

/* ============ Huff la Puff ============ */
.g-huff { --slot-bg: radial-gradient(420px 220px at 85% 0%, rgba(253, 224, 71, .22), transparent 70%), linear-gradient(180deg, #0d2a4a 0%, #12331f 60%, #0b1d10 100%); }
.rs-cell.brick { background: radial-gradient(circle, rgba(240, 118, 90, .3), transparent 70%); }
.rs-cell.brick svg { filter: drop-shadow(0 0 10px rgba(255, 120, 80, .8)); }
.rs-cell.jpb svg { filter: drop-shadow(0 0 12px rgba(253, 224, 71, .95)); }
.rs-cell .cv.jn { font-size: calc(11cqh / var(--rows) * 3); letter-spacing: .05em; }
.wolf-face.svgwolf { transform: none; }

/* colour-cell bonus */

.hc-board .hcell { --lc: rgba(255, 255, 255, .08); --lg: transparent; border: 2px solid var(--lc); box-shadow: 0 0 14px var(--lg), inset 0 0 18px var(--lg); transition: border-color .3s, box-shadow .3s; }
.hcell.c1 { --lc: #ef4444; --lg: rgba(239, 68, 68, .55); }

@keyframes goldCell { 50% { box-shadow: 0 0 26px var(--lg), inset 0 0 26px var(--lg); } }
.hs-sym.hc { background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--lc) 35%, transparent), rgba(0, 0, 0, .55)); }
.hs-sym.hc svg { width: 56%; height: 56%; filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .6)); }
.hs-sym.hc .q { position: absolute; right: 7cqh; bottom: 4cqh; font-size: 22cqh; color: #fff; text-shadow: 0 0 10px var(--lc), 0 2px 0 rgba(0, 0, 0, .7); }
.hcell.c3 .hs-sym.hc { background: radial-gradient(circle at 50% 40%, rgba(253, 224, 71, .45), rgba(120, 53, 15, .6)); }
.hc-board.spin .hcell::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent, rgba(255, 255, 255, .22), transparent); animation: hcSweep .65s linear; pointer-events: none; }
@keyframes hcSweep { from { transform: translateY(-100%); } to { transform: translateY(100%); } }
.hc-drop { position: absolute; inset: 8%; z-index: 3; display: grid; place-items: center; animation: hcDrop .34s cubic-bezier(.5, 0, .7, 1.4) both; }
.hc-drop svg { width: 80%; height: 80%; filter: drop-shadow(0 0 14px #fde047); }
@keyframes hcDrop { from { transform: translateY(-140%) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
.hcell.blown .hs-sym.hc svg { animation: houseFly .5s ease-in forwards; }

@keyframes houseFly { to { transform: translate(160%, -60%) rotate(70deg) scale(.5); opacity: 0; } }
.hc-val { display: flex; flex-direction: column; align-items: center; animation: hsPop .55s cubic-bezier(.3, 1.8, .5, 1); }
.hc-val .mx { font: 900 26cqh/1 Orbitron, sans-serif; color: #fff; text-shadow: 0 0 12px var(--lc), 0 2px 0 rgba(0, 0, 0, .7); }
.hc-val small { font: 800 11cqh Orbitron, sans-serif; color: #fde68a; margin-top: 2cqh; }
.hc-val.jpv small { font-size: 13cqh; color: var(--jc); letter-spacing: .08em; }
.hc-val.jpv b { font: 900 18cqh Orbitron, sans-serif; color: #fff7d6; text-shadow: 0 0 12px var(--jc); }
.pill.hcnt { min-width: 34px; justify-content: center; font-weight: 900; }
.pill.hcnt::before { content: ''; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; background: var(--lc); box-shadow: 0 0 8px var(--lc); }
.pill.hcnt.c1 { --lc: #ef4444; } .pill.hcnt.c2 { --lc: #3b82f6; } .pill.hcnt.c3 { --lc: #fbbf24; }
.house-roulette h3 { margin-bottom: 14px; }
.hr-wheel { position: relative; width: min(78vw, 58vh, 420px); aspect-ratio: 1; }
.hr-disc { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 30px rgba(253, 224, 71, .35)); }
.wseg { stroke: #1a0f05; stroke-width: 1.2; }

.hr-rim { fill: none; stroke: #fbbf24; stroke-width: 5; }
.hr-pointer { position: absolute; left: 50%; top: -10px; z-index: 2; width: 0; height: 0; transform: translateX(-50%); border: 16px solid transparent; border-top: 30px solid #fff; border-bottom: 0; filter: drop-shadow(0 0 8px #fde047); }
.hr-hub { position: absolute; inset: 37%; border-radius: 50%; background: radial-gradient(circle, #3a2410, #120a04); border: 4px solid #fbbf24; display: grid; place-items: center; box-shadow: 0 0 20px rgba(0, 0, 0, .7); }
.hr-hub svg { width: 78%; height: 78%; }
.hr-res { margin-top: 16px; font: 800 18px Orbitron, sans-serif; color: #fff; text-align: center; }
.hr-res b { font-size: 26px; }
.house-roulette.won1 .hr-res b { color: #f87171; text-shadow: 0 0 16px #ef4444; }

.house-roulette[class*=won] .hr-wheel { animation: hsPop .6s cubic-bezier(.3, 1.8, .5, 1); }
.jp.hit { animation: jpHit .9s cubic-bezier(.3, 1.8, .5, 1); }
@keyframes jpHit { 30% { transform: scale(1.25); box-shadow: 0 0 30px var(--jc); filter: brightness(1.6); } }
.pay-sym.svg svg { width: 44px; height: 44px; }
.paytable .pay-vals b { font-size: 13px; }
.about-stats { min-width: min(100%, 320px); }
.game-about .feat-chips { margin-top: 10px; }

/* ============ Bling Tower ============ */
.g-bling { --slot-bg: radial-gradient(500px 260px at 50% -5%, rgba(255, 45, 149, .3), transparent 70%), linear-gradient(180deg, #2a0b3d 0%, #12061f 100%); }
.g-bling .sg-cell { background: linear-gradient(180deg, rgba(162, 43, 255, .14), rgba(255, 45, 149, .06)); }
.sg-cell.scatter { background: radial-gradient(circle, rgba(52, 211, 153, .35), transparent 70%); }
.sg-cell.scatter svg { filter: drop-shadow(0 0 12px rgba(52, 211, 153, .95)); }
.slot.in-free .slot-bg { filter: hue-rotate(-20deg) saturate(1.4) brightness(1.15); }

/* ============ Pharaon Gold ============ */

.g-pharaon .sg-cell.scatter { background: radial-gradient(circle, rgba(253, 224, 71, .45), transparent 70%); }

.mult-meter b { font-size: 18px; color: #fde68a; text-shadow: 0 0 10px #f59e0b; }

/* ============ Bounty Reef ============ */
.g-bounty { --slot-bg: radial-gradient(520px 260px at 50% -5%, rgba(12, 147, 184, .4), transparent 70%), linear-gradient(180deg, #08385c 0%, #041627 100%); }

.rs-cell.scatter svg { filter: drop-shadow(0 0 14px rgba(253, 186, 116, .95)); }
.bubbles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 3; }

@keyframes bubble { to { transform: translateY(-120vh) translateX(20px); opacity: 0; } }
.g-overlay .intro-glyph svg { width: 120px; height: 120px; display: block; }

/* ============ Anubis Reborn ============ */
.g-anubis { --slot-bg: radial-gradient(520px 260px at 50% -5%, rgba(19, 168, 160, .35), transparent 70%), linear-gradient(180deg, #0e2a3a 0%, #070d1c 100%); }

.sg-cell.wild svg { filter: drop-shadow(0 0 12px rgba(248, 113, 113, .95)); animation: orbPulse 1.6s ease-in-out infinite; }
@keyframes orbPulse { 50% { scale: 1.08; } }
.sg-cell.gskull { background: radial-gradient(circle, rgba(253, 224, 71, .4), transparent 70%); }
.sg-lab { position: absolute; bottom: 6%; left: 50%; transform: translateX(-50%); font: 900 20cqh/1 Orbitron, sans-serif; color: #fff7d6; text-shadow: 0 0 6px #000, 0 0 10px #f59e0b; white-space: nowrap; }
.sg-cell.cube { background: radial-gradient(circle, rgba(186, 230, 253, .35), rgba(14, 116, 144, .35)); box-shadow: inset 0 0 0 2px rgba(125, 211, 252, .8), inset 0 0 18px rgba(125, 211, 252, .4); }
.sg-cell.sks { background: radial-gradient(circle, rgba(226, 232, 240, .3), transparent 70%); }
.sg-cell.gsk { background: radial-gradient(circle, rgba(253, 224, 71, .5), transparent 70%); box-shadow: inset 0 0 0 2px #fde047; }
.sg-cell.rc { background: radial-gradient(circle, rgba(248, 113, 113, .5), transparent 70%); }
.judge .sg-cell.dim { opacity: .18; }
.col-row { display: none; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 0 6px; margin: 0 auto; width: min(100%, calc((100vh - var(--chrome)) * 5 / 6)); min-width: min(100%, 240px); }
.col-row.on { display: grid; }
.col-row > div { position: relative; text-align: center; padding: 6px 2px; margin: 6px 0; border-radius: 10px; background: rgba(0, 0, 0, .45); border: 1px solid rgba(94, 234, 212, .35); font: 800 14px Orbitron, sans-serif; font-variant-numeric: tabular-nums; }
.mrow > div.hot { color: #5eead4; border-color: #5eead4; box-shadow: 0 0 14px rgba(94, 234, 212, .45); }
.jrow > div b { display: block; color: #bae6fd; font-size: 15px; }

@keyframes rollPulse { 50% { box-shadow: 0 0 16px rgba(125, 211, 252, .6); } }
.jrow .lbl { position: absolute; left: 50%; top: 100%; transform: translate(-50%, 0); font: 900 16px Orbitron, sans-serif; font-style: normal; opacity: 0; pointer-events: none; z-index: 5; white-space: nowrap; }
.jrow .lbl.go { animation: lblUp 1.1s ease-out; }
.jrow .lbl.ls { color: #e2e8f0; } .jrow .lbl.lg { color: #fde047; } .jrow .lbl.lr { color: #f87171; }
@keyframes lblUp { 0% { opacity: 0; transform: translate(-50%, 20px) scale(.6); } 25% { opacity: 1; transform: translate(-50%, 0) scale(1.2); } 100% { opacity: 0; transform: translate(-50%, -26px) scale(1); } }

/* ============ Cluster reveal items (Candy Queen) ============ */
@keyframes rbGlow { 50% { box-shadow: 0 0 26px #fff, inset 0 0 20px #fff; } }
