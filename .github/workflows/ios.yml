# Builds the SpinBet iPhone app (ios/) on a Mac of GitHub and sends it to App Store Connect (TestFlight), no Mac needed.
# Runs when ios/ changes, or by hand (Actions → « Appli iPhone » → Run workflow).
# Secrets needed (Settings → Secrets and variables → Actions), all from App Store Connect → Users and Access →
# Integrations → App Store Connect API (key with the « Admin » role):
#   APPSTORE_KEY_ID      the key's ID (10 characters)
#   APPSTORE_ISSUER_ID   the Issuer ID shown above the keys
#   APPSTORE_KEY_P8      the whole content of the downloaded AuthKey_XXXX.p8 file
#   APPLE_TEAM_ID        the Team ID (developer.apple.com → Account → Membership details)
# Without them, the app is only built for the simulator (a check that the code compiles).
name: Appli iPhone

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

concurrency:
  group: ios-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Clés Apple
        id: key
        env:
          KID: ${{ secrets.APPSTORE_KEY_ID }}
          ISS: ${{ secrets.APPSTORE_ISSUER_ID }}
          P8: ${{ secrets.APPSTORE_KEY_P8 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$KID" ] || [ -z "$ISS" ] || [ -z "$P8" ] || [ -z "$TEAM" ]; then
            echo "::warning::Secrets Apple absents : simple essai de compilation (simulateur), rien n'est envoyé à Apple."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Projet Xcode
        working-directory: ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Essai de compilation (simulateur)
        if: steps.key.outputs.ok != 'true'
        run: |
          xcodebuild -project ios/SpinBet.xcodeproj -scheme SpinBet -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
          exit ${PIPESTATUS[0]}
      - name: Fabriquer et envoyer à App Store Connect
        if: steps.key.outputs.ok == 'true'
        env:
          KID: ${{ secrets.APPSTORE_KEY_ID }}
          ISS: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/AuthKey.p8 -authenticationKeyID $KID -authenticationKeyIssuerID $ISS"
          xcodebuild -project ios/SpinBet.xcodeproj -scheme SpinBet -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SpinBet.xcarchive" archive \
            DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION="${{ github.run_number }}" $AUTH | tail -40
          test "${PIPESTATUS[0]}" = 0
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/SpinBet.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/out" $AUTH | tail -40
          test "${PIPESTATUS[0]}" = 0
          echo "Envoyé à App Store Connect : build ${{ github.run_number }} (visible dans TestFlight d'ici 10 à 30 min)."
