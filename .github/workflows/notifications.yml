# Notifications SpinBet sur les téléphones (gratuit) : voir tools/push/send.mjs.
# Pour envoyer un message à tout le monde : onglet Actions → « Notifications » → Run workflow.
name: Notifications

on:
  schedule:
    - cron: '35 11,12 * * *'   # roue du jour, 13 h 35 à Paris (heure d'été / d'hiver)
    - cron: '35 18,19 * * *'   # tournoi du soir, 20 h 35 à Paris
    - cron: '35 9,10 * * 6'    # tournoi du week-end, samedi 11 h 35 à Paris
    - cron: '2,32 10-20 * * *' # événements flash (12 h → 21 h 30 à Paris), voir extras.js
  workflow_dispatch:
    inputs:
      title:
        description: 'Titre (ex. 🎄 La machine de Noël est arrivée !)'
        required: true
        default: 'SpinBet Casino'
      body:
        description: 'Message'
        required: true
      url:
        description: 'Page à ouvrir (ex. https://www.spinbetcaz.com/#game-noel)'
        required: false
        default: 'https://www.spinbetcaz.com/'

permissions:
  contents: write # the free message is also put on the data branch for the Android app

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        working-directory: tools/push
      - run: node tools/push/send.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_TITLE: ${{ github.event.inputs.title }}
          PUSH_BODY: ${{ github.event.inputs.body }}
          PUSH_URL: ${{ github.event.inputs.url }}
      # Free message (Run workflow): also written to push/annonce.json on the data branch, where the Android app
      # (android/…/Notifs.java) reads it at each wake-up (it cannot receive the site's notifications).
      - name: Message pour l'appli Android
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        env:
          PUSH_TITLE: ${{ github.event.inputs.title }}
          PUSH_BODY: ${{ github.event.inputs.body }}
          PUSH_URL: ${{ github.event.inputs.url }}
        run: |
          git clone --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data 2>/dev/null || {
            mkdir data && cd data && git init -q -b data && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" && cd ..; }
          mkdir -p data/push
          node -e "const e=process.env; require('fs').writeFileSync('data/push/annonce.json', JSON.stringify({ id: '${{ github.run_id }}', t: Date.now(), title: e.PUSH_TITLE || 'SpinBet Casino', body: e.PUSH_BODY || '', url: e.PUSH_URL || 'https://www.spinbetcaz.com/' }))"
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add push/annonce.json
          git commit -qm "Annonce $(date -u +%Y-%m-%dT%H:%M)" || exit 0
          for i in 1 2 3 4; do git push -q origin HEAD:data && exit 0; sleep $((i * 3)); git pull -q --rebase origin data || true; done
          exit 1
