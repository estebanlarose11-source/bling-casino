# Les jeux du moment (page #stats) : tools/admin/public-stats.mjs lit Firestore stats/ chaque heure et range le
# résumé public dans stats/public.json sur la branche « data » (lu par le site). Secret : FIREBASE_SERVICE_ACCOUNT.
name: Tendances

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  tendances:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
      - name: Branche data
        run: |
          git clone --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data 2>/dev/null || {
            mkdir data && cd data && git init -q -b data && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"; }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        working-directory: site/tools/push
      - name: Calculer les tendances
        run: cp site/tools/admin/public-stats.mjs site/tools/push/public-stats.mjs && node site/tools/push/public-stats.mjs data/stats/public.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Enregistrer
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/public.json
          git commit -qm "Tendances $(date -u +%Y-%m-%dT%H:%M)" || { echo "Rien de nouveau"; exit 0; }
          for i in 1 2 3; do git pull -q --rebase origin data 2>/dev/null; git push -q origin HEAD:data && break; sleep 5; done
